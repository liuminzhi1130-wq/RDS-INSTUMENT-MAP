<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS1 座標精確標定工具 - 🔨 槌子模式</title>
    <style>
        :root { --magenta: #ff00ff; --bg: #0f0f0f; }
        body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { padding: 15px 20px; background: #222; display: flex; gap: 10px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #sInput { flex-grow: 1; padding: 12px; border-radius: 8px; border: 2px solid #444; background: #000; color: #00ff41; font-size: 20px; font-weight: bold; }

        /* 地圖視窗：預設槌子游標 */
        .map-view { 
            flex-grow: 1; 
            overflow: auto; 
            background: #1a1a1a; 
            position: relative; 
            /* 使用 SVG 產生槌子游標 */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px;'><text y='20'>🔨</text></svg>") 16 16, crosshair;
            user-select: none;
        }

        .map-container { position: relative; display: inline-block; padding: 50px; }
        #mapImg { display: block; max-width: none; border: 2px solid #333; }

        /* 定位點樣式 */
        .dot { position: absolute; width: 16px; height: 16px; background: var(--magenta); border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 50; pointer-events: none; }
        .dot.active { display: block; animation: flash 0.6s infinite alternate; }
        @keyframes flash {
            from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            to { opacity: 0.5; transform: translate(-50%, -50%) scale(2); box-shadow: 0 0 20px var(--magenta); }
        }
        .tag { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 16px; white-space: nowrap; }

        .info-panel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 30px; border: 1px solid var(--magenta); font-size: 14px; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header">
        <input type="text" id="sInput" placeholder="🔍 搜尋閥號 (輸入數字即定位)..." autocomplete="off">
    </div>

    <div class="map-view" id="mapView">
        <div class="map-container">
            <img src="RDS1_map.png" id="mapImg" draggable="false">
            <div id="layer"></div>
        </div>
    </div>

    <div class="info-panel">
        🔨 模式啟動：按住滑鼠可拖移，輕點紅色圓圈標籤可產生座標代碼
    </div>

    <script>
        // 目前確認精準的座標 (請以此格式持續回傳給我)
        const vData = [
            { id: "LV426", x: 50.8, y: 46.8 }, 
            { id: "EMV908", x: 50.8, y: 51.8 }
        ];

        const mapView = document.getElementById('mapView');
        const layer = document.getElementById('layer');
        const sInput = document.getElementById('sInput');
        const mapImg = document.getElementById('mapImg');

        let isDragging = false;
        let startX, startY, scrollLeft, scrollTop;
        let mouseDownTime;

        // --- 拖曳與點擊邏輯分離 ---

        mapView.addEventListener('mousedown', (e) => {
            isDragging = true;
            mouseDownTime = new Date().getTime();
            startX = e.pageX - mapView.offsetLeft;
            startY = e.pageY - mapView.offsetTop;
            scrollLeft = mapView.scrollLeft;
            scrollTop = mapView.scrollTop;
        });

        mapView.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - mapView.offsetLeft;
            const y = e.pageY - mapView.offsetTop;
            const walkX = (x - startX);
            const walkY = (y - startY);
            mapView.scrollLeft = scrollLeft - walkX;
            mapView.scrollTop = scrollTop - walkY;
        });

        mapView.addEventListener('mouseup', (e) => {
            const mouseUpTime = new Date().getTime();
            const timeDiff = mouseUpTime - mouseDownTime;
            isDragging = false;

            // 核心修正：如果按住時間短於 200ms，視為「敲擊」動作
            if (timeDiff < 200) {
                handleHammerClick(e);
            }
        });

        mapView.addEventListener('mouseleave', () => { isDragging = false; });

        // --- 槌子敲擊產生座標 ---
        function handleHammerClick(e) {
            const rect = mapImg.getBoundingClientRect();
            // 計算圖片上的百分比座標
            const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(2);
            const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(2);
            
            const tag = prompt("🔨 敲擊成功！請輸入此點位的控制閥編號：", "LV");
            if (tag) {
                const codeLine = `{ id: "${tag}", x: ${x}, y: ${y} },`;
                // 自動複製到剪貼簿，方便你貼給我
                navigator.clipboard.writeText(codeLine).then(() => {
                    alert("座標已自動複製到剪貼簿！\n\n" + codeLine + "\n\n請收集後整段貼給 AI。");
                });
                console.log(codeLine);
            }
        }

        // --- 初始化與搜尋 ---
        function init() {
            layer.innerHTML = '';
            vData.forEach(v => {
                const d = document.createElement('div');
                d.className = 'dot'; d.id = `v-${v.id}`;
                d.style.left = v.x + '%'; d.style.top = v.y + '%';
                d.innerHTML = `<span class="tag">${v.id}</span>`;
                layer.appendChild(d);
            });
        }

        sInput.addEventListener('input', (e) => {
            const val = e.target.value.toUpperCase().trim();
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            if (val.length < 1) return;
            const target = vData.find(v => v.id.includes(val));
            if (target) {
                const el = document.getElementById(`v-${target.id}`);
                el.classList.add('active');
                el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }
        });

        window.onload = init;
    </script>
</body>
</html>
