<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS1 控制閥定位系統 - 深度縮放優化版</title>
    <style>
        :root { --target: #ff00ff; --bg: #0a0a0a; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 頂部控制欄 */
        .header { padding: 10px 15px; background: #222; display: flex; flex-direction: column; gap: 10px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .search-row { display: flex; gap: 10px; align-items: center; }
        #sInput { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #00ff41; font-size: 18px; font-weight: bold; }
        
        .zoom-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #aaa; padding: 2px 0; }
        #zoomRange { flex-grow: 1; accent-color: var(--target); }
        #zoomVal { color: var(--target); font-weight: bold; width: 45px; text-align: right; }

        /* 地圖顯示區域 */
        .map-view { flex-grow: 1; overflow: auto; background: #1a1a1a; position: relative; cursor: grab; user-select: none; }
        .map-view:active { cursor: grabbing; }
        .map-view.ready-to-hammer {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px;'><text y='20'>🔨</text></svg>") 16 16, crosshair !important;
        }

        .map-container { position: relative; display: inline-block; padding: 60px; transition: width 0.05s ease-out; }
        #mapImg { display: block; width: 100%; border: 1px solid #333; }

        /* 定位點樣式 */
        .dot { position: absolute; width: 16px; height: 16px; background: var(--target); border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 50; pointer-events: none; }
        .dot.active { display: block; animation: flash 0.6s infinite alternate; }
        @keyframes flash { from { opacity: 1; transform: translate(-50%, -50%) scale(1); } to { opacity: 0.3; transform: translate(-50%, -50%) scale(2.5); box-shadow: 0 0 15px var(--target); } }
        
        .v-label { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        .hint-bar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #777; background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 20px; z-index: 1000; pointer-events: none; }
    </style>
</head>

        const mapView = document.getElementById('mapView');

        const layer = document.getElementById('layer');
        const zoomRange = document.getElementById('zoomRange');
        const zoomVal = document.getElementById('zoomVal');
        const sInput = document.getElementById('sInput');

        let isDragging = false, startX, startY, scrollLeft, scrollTop, hoverTimer, isReadyToHammer = false;

        function initDots() {
            layer.innerHTML = '';
            vData.forEach(v => {
                const d = document.createElement('div');
                d.className = 'dot'; d.id = `v-${v.id}`;
                d.style.left = v.x + '%'; d.style.top = v.y + '%';
                d.innerHTML = `<span class="v-label">${v.id}</span>`;
                layer.appendChild(d);
            });
        }

        zoomRange.addEventListener('input', (e) => {
            const val = e.target.value;
            zoomVal.innerText = val + '%';
            mapContainer.style.width = val + '%';
            resetHammerStatus();
        });

        mapView.addEventListener('mousemove', (e) => {
            if (isDragging) {
                mapView.scrollLeft = scrollLeft - (e.pageX - mapView.offsetLeft - startX);
                mapView.scrollTop = scrollTop - (e.pageY - mapView.offsetTop - startY);
                resetHammerStatus();
            } else {
                resetHammerStatus();
                hoverTimer = setTimeout(() => {
                    isReadyToHammer = true;
                    mapView.classList.add('ready-to-hammer');
                }, 1000); 
            }
        });

        function resetHammerStatus() {
            clearTimeout(hoverTimer);
            isReadyToHammer = false;
            mapView.classList.remove('ready-to-hammer');
        }

        mapView.addEventListener('mousedown', (e) => {
            if (isReadyToHammer) return;
            isDragging = true;
            startX = e.pageX - mapView.offsetLeft;
            startY = e.pageY - mapView.offsetTop;
            scrollLeft = mapView.scrollLeft;
            scrollTop = mapView.scrollTop;
        });

        window.addEventListener('mouseup', (e) => {
            if (isReadyToHammer && e.target.id === 'mapImg') {
                const rect = mapImg.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(2);
                const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(2);
                const result = `{ id: "TAG", x: ${x}, y: ${y} },`;
                prompt("🔨 標定成功！代碼：", result);
                resetHammerStatus();
            }
            isDragging = false;
        });

        sInput.addEventListener('input', (e) => {
            const val = e.target.value.toUpperCase().trim();
            document.querySelectorAll('.dot').forEach(d => { d.style.display = 'none'; d.classList.remove('active'); });
            if (val.length < 1) return;
            const target = vData.find(v => v.id.includes(val));
            if (target) {
                const el = document.getElementById(`v-${target.id}`);
                el.style.display = 'block'; el.classList.add('active');
                el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }
        });

        window.onload = initDots;
